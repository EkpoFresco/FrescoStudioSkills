# rbx-studio per-game config. Docs: {{RBX_HOME}}/docs/config.md
schema_version: 1
studio_version: 2.0.0

modes:
  rigor: minimal            # minimal | standard | full

roblox:
  toolchain: mcp            # mcp | rojo | hybrid | studio-only
  genre: ""                 # file stem in library/roblox/genres/ (e.g. idle-clicker)
  target_devices: [phone, desktop, tablet, console]
  monetization_style: light # none | light | standard | heavy
  team_size: 1
  analytics: false
  universe_id: ""
  place_ids: []

paths:
  server: src/server
  client: src/client
  shared: src/shared
  data_module: ""           # e.g. src/server/Data or ServerScriptService.Data
  receipt_handler: ""
  handoffs: .rbx-studio/handoffs

remotes:
  guard_words: []           # extra words that count as validation for the commit hook

git:
  main_branch: main
  local_commits: true
  push_requires_approval: true

team:
  github_repo: ""           # owner/name
